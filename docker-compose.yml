services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dpig_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dpig_db}
      POSTGRES_USER: ${POSTGRES_USER:-dpig_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpig_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpig_user} -d ${POSTGRES_DB:-dpig_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dpig_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dpig-app:latest
    container_name: dpig_web
    restart: unless-stopped
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120", "--reload", "dpig.wsgi:application"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dpig_db}
      POSTGRES_USER: ${POSTGRES_USER:-dpig_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpig_secure_pass_2026}
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "False"
      DJANGO_DEBUG: "True"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: dpig-app:latest
    container_name: dpig_celery_worker
    restart: unless-stopped
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["celery", "-A", "dpig", "worker", "-l", "INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dpig_db}
      POSTGRES_USER: ${POSTGRES_USER:-dpig_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpig_secure_pass_2026}
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "False"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: dpig-app:latest
    container_name: dpig_celery_beat
    restart: unless-stopped
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["celery", "-A", "dpig", "beat", "-l", "INFO"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dpig_db}
      POSTGRES_USER: ${POSTGRES_USER:-dpig_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpig_secure_pass_2026}
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "False"
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: dpig_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  media_data:
