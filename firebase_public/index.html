<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPIG Platform - Staging</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 50px 20px; color: #1e293b; background: #f8fafc; }
    .card { max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 32px; border: 1px solid #e2e8f0; }
    h1 { font-size: 24px; color: #0f172a; margin-bottom: 12px; }
    p { color: #64748b; line-height: 1.6; }
    .badge { display: inline-block; padding: 4px 12px; background: #e0f2fe; color: #0284c7; border-radius: 9999px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
    a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #0284c7; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">DPIG Cloud Edge</div>
    <h1>Digital Public Infrastructure Governance</h1>
    <p>Firebase CDN Edge proxy is active. Dynamic requests are routed directly to Cloud Run microservices.</p>
    <a href="/">Access Portal</a>
  </div>
</body>
</html>
