  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_DB_PASSWORD"
  GEMINI_API_KEY: "CHANGE_ME_GEMINI_API_KEY"
  EMAIL_HOST_USER: "notifications@dpig.gov.in"
  EMAIL_HOST_PASSWORD: "CHANGE_ME_SMTP_APP_PASSWORD"
  GOOGLE_MAPS_API_KEY: ""
  INTERNAL_API_KEY: "CHANGE_ME_INTERNAL_WEBHOOK_SECRET_KEY"
