apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpig-web
  namespace: dpig
  labels:
    app: dpig-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dpig-web
  template:
    metadata:
      labels:
        app: dpig-web
    spec:
      containers:
        - name: web
          image: dpig:latest
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120", "dpig.wsgi:application"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dpig-config
            - secretRef:
                name: dpig-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dpig-web-service
  namespace: dpig
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: dpig-web
